<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖中辯論隊計時工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
        }
        /* 自訂背景圖層 */
        #bgLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: left center;
            background-image: url('聖六 (1).jpg');
            opacity: 1;
            z-index: -2;
            transition: opacity 0.5s ease, background-image 0.5s ease;
        }
        .dark #bgLayer {
            opacity: 0.7;
        }
        
        /* 玻璃遮罩 */
        #bgOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: -1;
            transition: background 0.3s ease;
        }
        .dark #bgOverlay {
            background: rgba(15, 23, 42, 0.5);
        }

        /* 磨砂玻璃面板樣式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .sidebar-transition {
            transition: margin 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 發光文字特效 */
        .glow-text { text-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        .glow-text-yellow { text-shadow: 0 0 20px rgba(217, 119, 6, 0.5); }
        .glow-text-red { text-shadow: 0 0 20px rgba(220, 38, 38, 0.5); }
        
        /* 自由辯論區塊交互效果 */
        .free-debate-card {
            transition: all 0.3s ease;
            filter: grayscale(40%) opacity(0.8);
        }
        .free-debate-card.active {
            filter: grayscale(0%) opacity(1);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
        }
        .dark .free-debate-card.active {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.4); }
        
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 h-screen flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

    <!-- 背景層 -->
    <div id="bgLayer"></div>
    <div id="bgOverlay"></div>

    <!-- 頂部導覽列 -->
    <header class="glass-panel px-4 md:px-6 py-3 flex justify-between items-center z-30 relative">
        <div class="flex items-center gap-2 md:gap-3">
            <button onclick="toggleSidebar()" class="flex items-center gap-2 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 px-3 md:px-4 py-2 rounded-lg text-slate-700 dark:text-slate-200 font-bold transition active:scale-95 border border-slate-200 dark:border-slate-600 shadow-sm">
                <svg id="sidebarIcon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                <span class="hidden sm:inline" id="sidebarBtnText">收起設定</span>
            </button>
            
            <button onclick="toggleTheme()" class="flex items-center justify-center p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm active:scale-95" title="切換亮色/暗色主題">
                <svg id="themeIconSun" class="w-5 h-5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="themeIconMoon" class="w-5 h-5 block dark:hidden text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
        
        <div class="group relative flex items-center justify-center flex-1 mx-2 md:mx-4">
            <h1 id="matchTitle" contenteditable="true" spellcheck="false" class="text-xl md:text-3xl font-black text-blue-900 dark:text-blue-300 tracking-wider text-center outline-none border-b border-transparent focus:border-blue-400 dark:focus:border-blue-500 hover:border-slate-300 dark:hover:border-slate-500 transition px-2 py-1 max-w-full overflow-hidden whitespace-nowrap" title="點擊修改比賽名稱">
                聖中辯論隊計時工具
            </h1>
            <svg class="w-4 h-4 text-slate-400 ml-2 opacity-0 group-hover:opacity-100 transition absolute right-[-20px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </div>

        <button onclick="toggleRecordsModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 px-3 md:px-4 py-2 rounded-lg text-white font-bold transition active:scale-95 shadow-md border border-indigo-500 dark:border-indigo-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            <span class="hidden sm:inline">歷史記錄</span>
        </button>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        
        <aside id="sidebar" class="sidebar-transition custom-scrollbar absolute md:relative z-20 w-[20rem] md:w-[22rem] h-full glass-panel border-r border-slate-200 dark:border-slate-700 overflow-y-auto transform transition-all duration-300 flex-shrink-0 left-0 md:left-auto -translate-x-full md:translate-x-0">
            <div class="p-4 md:p-5 pb-24 space-y-6">
                
                <!-- 常規環節時間設定 -->
                <div>
                    <h2 class="text-sm font-bold text-slate-800 dark:text-slate-200 mb-3 flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">

                    </h2>
                    
                    <!-- 1. 經典模式專屬設定面板 -->
                    <div id="classicSettings" class="space-y-3">
                        <!-- 主辯 -->
                        <div class="bg-white/80 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-10 font-bold text-slate-700 dark:text-slate-300 text-sm">主辯</span>
                                <input type="number" id="m_zhu" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="3" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>
                                <input type="number" id="s_zhu" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="0" min="0" max="59">
                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="setupNormalStage('正方主辯', 'm_zhu', 's_zhu', 'text-blue-700 dark:text-blue-400')" class="flex-1 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 border border-blue-200 dark:border-blue-800 py-1.5 rounded-lg text-sm font-bold text-blue-700 dark:text-blue-400 transition">正方</button>
                                <button onclick="setupNormalStage('反方主辯', 'm_zhu', 's_zhu', 'text-red-700 dark:text-red-400')" class="flex-1 bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 py-1.5 rounded-lg text-sm font-bold text-red-700 dark:text-red-400 transition">反方</button>
                            </div>
                        </div>

                        <!-- 一副 -->
                        <div class="bg-white/80 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-10 font-bold text-slate-700 dark:text-slate-300 text-sm">一副</span>
                                <input type="number" id="m_yi" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="3" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>
                                <input type="number" id="s_yi" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="0" min="0" max="59">
                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="setupNormalStage('正方一副', 'm_yi', 's_yi', 'text-blue-700 dark:text-blue-400')" class="flex-1 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 border border-blue-200 dark:border-blue-800 py-1.5 rounded-lg text-sm font-bold text-blue-700 dark:text-blue-400 transition">正方</button>
                                <button onclick="setupNormalStage('反方一副', 'm_yi', 's_yi', 'text-red-700 dark:text-red-400')" class="flex-1 bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 py-1.5 rounded-lg text-sm font-bold text-red-700 dark:text-red-400 transition">反方</button>
                            </div>
                        </div>

                        <!-- 二副 -->
                        <div class="bg-white/80 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-10 font-bold text-slate-700 dark:text-slate-300 text-sm">二副</span>
                                <input type="number" id="m_er" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="3" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>
                                <input type="number" id="s_er" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="0" min="0" max="59">
                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="setupNormalStage('正方二副', 'm_er', 's_er', 'text-blue-700 dark:text-blue-400')" class="flex-1 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 border border-blue-200 dark:border-blue-800 py-1.5 rounded-lg text-sm font-bold text-blue-700 dark:text-blue-400 transition">正方</button>
                                <button onclick="setupNormalStage('反方二副', 'm_er', 's_er', 'text-red-700 dark:text-red-400')" class="flex-1 bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 py-1.5 rounded-lg text-sm font-bold text-red-700 dark:text-red-400 transition">反方</button>
                            </div>
                        </div>

                        <!-- 結辯 -->
                        <div class="bg-white/80 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-10 font-bold text-slate-700 dark:text-slate-300 text-sm">結辯</span>
                                <input type="number" id="m_jie" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="4" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>

                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>
                            </div>
                            <div class="flex gap-2">

                                <button onclick="setupNormalStage('反方結辯', 'm_jie', 's_jie', 'text-red-700 dark:text-red-400')" class="flex-1 bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 py-1.5 rounded-lg text-sm font-bold text-red-700 dark:text-red-400 transition">反方</button>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 質詢模式專屬設定面板 (動態顯示/隱藏) -->
                    <div id="interrogationSettings" class="space-y-3 hidden">
                        <!-- 陳詞與反駁 -->
                        <div class="bg-white/80 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-16 font-bold text-slate-700 dark:text-slate-300 text-sm">陳詞/反駁</span>
                                <input type="number" id="m_int_chen" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="3" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>
                                <input type="number" id="s_int_chen" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500" value="0" min="0" max="59">
                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <button onclick="setupNormalStage('正方主辯陳詞', 'm_int_chen', 's_int_chen', 'text-blue-700 dark:text-blue-400')" class="bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 border border-blue-200 dark:border-blue-800 py-1.5 rounded-lg text-xs font-bold text-blue-700 dark:text-blue-400 transition">正主陳詞</button>
                                <button onclick="setupNormalStage('反方主辯陳詞', 'm_int_chen', 's_int_chen', 'text-red-700 dark:text-red-400')" class="bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 py-1.5 rounded-lg text-xs font-bold text-red-700 dark:text-red-400 transition">反主陳詞</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="setupNormalStage('正方第一副辯反駁', 'm_int_chen', 's_int_chen', 'text-blue-700 dark:text-blue-400')" class="bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 border border-blue-200 dark:border-blue-800 py-1.5 rounded-lg text-xs font-bold text-blue-700 dark:text-blue-400 transition">正一副反駁</button>
                                <button onclick="setupNormalStage('反方第一副辯反駁', 'm_int_chen', 's_int_chen', 'text-red-700 dark:text-red-400')" class="bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 py-1.5 rounded-lg text-xs font-bold text-red-700 dark:text-red-400 transition">反一副反駁</button>

                                <span class="w-16 font-bold text-slate-700 dark:text-slate-300 text-sm">結辯質詢</span>
                                <input type="number" id="m_int_zhi1" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-purple-500" value="1" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>
                                <input type="number" id="s_int_zhi1" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-purple-500" value="30" min="0" max="59">
                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="setupNormalStage('反方結辯質詢正方主辯', 'm_int_zhi1', 's_int_zhi1', 'text-purple-600 dark:text-purple-400')" class="bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 border border-purple-200 dark:border-purple-800 py-1.5 rounded-lg text-xs font-bold text-purple-700 dark:text-purple-400 transition">反結質正主</button>
                                <button onclick="setupNormalStage('正方結辯質詢反方主辯', 'm_int_zhi1', 's_int_zhi1', 'text-purple-600 dark:text-purple-400')" class="bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 border border-purple-200 dark:border-purple-800 py-1.5 rounded-lg text-xs font-bold text-purple-700 dark:text-purple-400 transition">正結質反主</button>
                            </div>
                        </div>

                        <!-- 二副質詢 -->
                        <div class="bg-white/80 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-16 font-bold text-slate-700 dark:text-slate-300 text-sm">二副質詢</span>
                                <input type="number" id="m_int_zhi2" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-purple-500" value="2" min="0">
                                <span class="text-xs text-slate-500 dark:text-slate-400">分</span>
                                <input type="number" id="s_int_zhi2" class="w-12 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-center rounded p-1 text-slate-900 dark:text-white focus:outline-none focus:border-purple-500" value="0" min="0" max="59">
                                <span class="text-xs text-slate-500 dark:text-slate-400">秒</span>

                            <svg class="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                            雙方暫停
                        </button>
                        <button onclick="logCurrentTime()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-base md:text-lg font-bold py-2.5 px-6 rounded-2xl shadow-lg transition active:scale-95 flex items-center gap-2">
                            記錄用時
                        </button>
                        <button onclick="setupFreeDebate()" class="bg-slate-600 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white text-base md:text-lg font-bold py-2.5 px-6 rounded-2xl shadow-lg transition active:scale-95 flex items-center gap-2">
                            重置自由辯
                        </button>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <div id="recordsModal" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 z-50 flex justify-center items-center backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl w-11/12 max-w-2xl max-h-[80vh] flex flex-col shadow-2xl transform scale-95 transition-transform duration-300" id="recordsModalBox">
            <div class="flex justify-between items-center p-5 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 rounded-t-2xl">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    環節用時記錄
                </h3>
                <button onclick="toggleRecordsModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-5 overflow-y-auto flex-1 custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-500 dark:text-slate-400 text-sm border-b border-slate-200 dark:border-slate-700">
                            <th class="pb-2 font-bold">環節名稱</th>
                            <th class="pb-2 font-bold">設定時長</th>
                            <th class="pb-2 font-bold">實際用時</th>
                            <th class="pb-2 font-bold text-right">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="text-slate-800 dark:text-slate-200 divide-y divide-slate-100 dark:divide-slate-700/50">
                        <tr><td colspan="4" class="py-6 text-center text-slate-500 font-bold">尚無記錄</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-3 bg-slate-50 dark:bg-slate-900/50 rounded-b-2xl">
                <button onclick="clearRecords()" class="px-4 py-2 text-sm font-bold text-red-600 dark:text-red-400 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/30 rounded transition">清空記錄</button>
                <button onclick="toggleRecordsModal()" class="px-4 py-2 font-bold bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white rounded shadow-sm transition">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // --- 狀態變數 ---
        let timerInterval = null;
        let isSidebarOpen = window.innerWidth >= 768;
        
        let currentMode = 'classic'; // 'classic' 或 'interrogation'
        let isFreeDebateMode = false;

        // 常規計時器變數
        let totalSeconds = 0;
        let currentSeconds = 0;
        let isNormalRunning = false;
        let currentStageName = "比賽尚未開始";
        
        // 常規模式音效標記
        let played60sBeep = false;
        let played0sBeep = false;
        let playedMinus15sBeep = false;

        // 自由辯論變數
        let freeTotalSeconds = 0;
        let freeAffCurrent = 0;
        let freeNegCurrent = 0;
        let activeFreeSide = null;
        let freeAffHasStarted = false; 
        
        // 自由辯論音效標記
        let freeAff60sBeep = false, freeAff0sBeep = false, freeAffMinus15sBeep = false;
        let freeNeg60sBeep = false, freeNeg0sBeep = false, freeNegMinus15sBeep = false;

        // 歷史記錄
        let timeRecords = [];

        // 賽制流程：經典模式
        const classicStageSequence = [
            { name: '正方主辯', type: 'normal', minId: 'm_zhu', secId: 's_zhu', colorClass: 'text-blue-700 dark:text-blue-400' },
            { name: '反方主辯', type: 'normal', minId: 'm_zhu', secId: 's_zhu', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '正方一副', type: 'normal', minId: 'm_yi', secId: 's_yi', colorClass: 'text-blue-700 dark:text-blue-400' },
            { name: '反方一副', type: 'normal', minId: 'm_yi', secId: 's_yi', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '正方二副', type: 'normal', minId: 'm_er', secId: 's_er', colorClass: 'text-blue-700 dark:text-blue-400' },
            { name: '反方二副', type: 'normal', minId: 'm_er', secId: 's_er', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '自由辯論', type: 'free' },
            { name: '反方結辯', type: 'normal', minId: 'm_jie', secId: 's_jie', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '正方結辯', type: 'normal', minId: 'm_jie', secId: 's_jie', colorClass: 'text-blue-700 dark:text-blue-400' }
        ];

        // 賽制流程：質詢模式
        const interrogationStageSequence = [
            { name: '正方主辯陳詞', type: 'normal', minId: 'm_int_chen', secId: 's_int_chen', colorClass: 'text-blue-700 dark:text-blue-400' },
            { name: '反方主辯陳詞', type: 'normal', minId: 'm_int_chen', secId: 's_int_chen', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '反方結辯質詢正方主辯', type: 'normal', minId: 'm_int_zhi1', secId: 's_int_zhi1', colorClass: 'text-purple-600 dark:text-purple-400' },
            { name: '正方結辯質詢反方主辯', type: 'normal', minId: 'm_int_zhi1', secId: 's_int_zhi1', colorClass: 'text-purple-600 dark:text-purple-400' },
            { name: '正方第一副辯反駁', type: 'normal', minId: 'm_int_chen', secId: 's_int_chen', colorClass: 'text-blue-700 dark:text-blue-400' },
            { name: '反方第一副辯反駁', type: 'normal', minId: 'm_int_chen', secId: 's_int_chen', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '反方第二副辯質詢正方第一副辯', type: 'normal', minId: 'm_int_zhi2', secId: 's_int_zhi2', colorClass: 'text-purple-600 dark:text-purple-400' },
            { name: '正方第二副辯質詢反方第一副辯', type: 'normal', minId: 'm_int_zhi2', secId: 's_int_zhi2', colorClass: 'text-purple-600 dark:text-purple-400' },
            { name: '反方第二副辯小結', type: 'normal', minId: 'm_int_jie', secId: 's_int_jie', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '正方第二副辯小結', type: 'normal', minId: 'm_int_jie', secId: 's_int_jie', colorClass: 'text-blue-700 dark:text-blue-400' },
            { name: '準備時間 (台下指導)', type: 'normal', minId: 'm_prep1', secId: 's_prep1', colorClass: 'text-emerald-600 dark:text-emerald-400' },
            { name: '自由辯論', type: 'free' },
            { name: '準備時間', type: 'normal', minId: 'm_prep2', secId: 's_prep2', colorClass: 'text-emerald-600 dark:text-emerald-400' },
            { name: '反方結辯總結', type: 'normal', minId: 'm_int_zong', secId: 's_int_zong', colorClass: 'text-red-700 dark:text-red-400' },
            { name: '正方結辯總結', type: 'normal', minId: 'm_int_zong', secId: 's_int_zong', colorClass: 'text-blue-700 dark:text-blue-400' }
        ];

        let stageSequence = classicStageSequence; // 預設使用經典模式
        let currentStageIndex = -1;

        // --- 音效安全載入設定 ---
        let customAudio = null;
        let fallbackSynth = null;
        let audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            try {
                // 初始化備用 Tone.js 合成按鈴音色 (以防網路斷開)
                fallbackSynth = new Tone.FMSynth({
                    harmonicity: 3.01,
                    modulationIndex: 14,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 4.5, sustain: 0, release: 0.1 }
                }).toDestination();
                fallbackSynth.volume.value = -3;
                
                // 使用原生 HTML5 Audio 對象直接讀取 GitHub 音檔 (防止 CORS / MIME 類型解碼報錯)
                customAudio = new Audio();
                customAudio.crossOrigin = "anonymous";
                customAudio.src = "https://raw.githubusercontent.com/derek250/timer/main/YTD.mp3";
                customAudio.load();
                
                audioInitialized = true;
                console.log("Audio pipeline loaded successfully.");
            } catch (e) {
                console.error("Audio initialization error:", e);
            }
        }

        // 綁定頁面首次互動解鎖音訊
        document.addEventListener('click', function() {
            if (Tone.context.state !== 'running') Tone.start();
            initAudio();
        }, { once: true });

        function playBeep(times) {
            initAudio();
            if (Tone.context.state !== 'running') {
                Tone.start();
            }
            
            let count = 0;
            const playOnce = () => {
                if (customAudio) {
                    customAudio.currentTime = 0;
                    customAudio.play().catch(e => {
                        console.warn("Audio element blocked, fallback synth active:", e);
                        if (fallbackSynth) {
                            fallbackSynth.triggerAttackRelease("D6", "8n");
                            fallbackSynth.triggerAttackRelease("A6", "8n", "+0.15");
                        }
                    });
                } else if (fallbackSynth) {
                    fallbackSynth.triggerAttackRelease("D6", "8n");
                    fallbackSynth.triggerAttackRelease("A6", "8n", "+0.15");
                }
                count++;
                if (count < times) {
                    setTimeout(playOnce, 600); // 0.6 秒間隔
                }
            };
            playOnce();
        }

        function playStartSound() {
            playBeep(1);
        }

        // --- 介面操作函數 ---
        
        function getSoundConfig() {
            const w = parseInt(document.getElementById('cfg_sound1').value);
            const e = parseInt(document.getElementById('cfg_sound2').value);
            const o = parseInt(document.getElementById('cfg_sound3').value);
            return {
                warn: isNaN(w) ? 60 : w,
                end: isNaN(e) ? 0 : e,
                over: isNaN(o) ? -15 : o
            };
        }

        function formatTime(secs) {
            const isNegative = secs < 0;
            const absSecs = Math.abs(secs);
            const m = Math.floor(absSecs / 60).toString().padStart(2, '0');
            const s = (absSecs % 60).toString().padStart(2, '0');
            return `${isNegative ? '-' : ''}${m}:${s}`;
        }

        function showToast(msg, isWarning = true) {
            const toast = document.createElement('div');
            const bgClass = isWarning ? 'bg-red-600' : 'bg-emerald-600';
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 ${bgClass} text-white px-6 py-3 rounded-full shadow-2xl z-50 font-bold opacity-0 transition-opacity duration-300`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            updateSidebarUI();
        }

        function updateSidebarUI() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            const btnText = document.getElementById('sidebarBtnText');
            const icon = document.getElementById('sidebarIcon');

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                if (window.innerWidth >= 768) sidebar.classList.remove('md:-ml-[22rem]', 'md:-ml-[20rem]');
                else {
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                }
                btnText.innerText = "收起設定";
                icon.classList.remove('-rotate-180');
            } else {
                if (window.innerWidth >= 768) sidebar.classList.add('md:-ml-[22rem]');
                else {
                    sidebar.classList.remove('translate-x-0');
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
                btnText.innerText = "展開設定";
                icon.classList.add('-rotate-180');
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('bgLayer').style.backgroundImage = `url('${e.target.result}')`;
                    document.getElementById('bgLayer').style.opacity = '0.6'; 
                    showToast("背景已更新", false);
                }
                reader.readAsDataURL(file);
            }
        }

        function resetBackground() {
            document.getElementById('bgLayer').style.backgroundImage = "url('聖六 (1).jpg')";
            document.getElementById('bgLayer').style.opacity = '1'; 
            document.getElementById('bgInput').value = '';
            showToast("已恢復預設背景", false);
        }

        // --- STREAMING_CHUNK: 賽制切換核心邏輯 ---
        function changeTournamentMode() {
            const modeSelect = document.getElementById('tournamentMode').value;
            currentMode = modeSelect;
            
            const classicSettings = document.getElementById('classicSettings');
            const interrogationSettings = document.getElementById('interrogationSettings');
            
            if (currentMode === 'classic') {
                stageSequence = classicStageSequence;
                classicSettings.classList.remove('hidden');
                interrogationSettings.classList.add('hidden');
                document.getElementById('m_free').value = "4";
                document.getElementById('s_free').value = "0";
                showToast("已切換至經典模式", false);
            } else if (currentMode === 'interrogation') {
                stageSequence = interrogationStageSequence;
                classicSettings.classList.add('hidden');
                interrogationSettings.classList.remove('hidden');
                document.getElementById('m_free').value = "3";
                document.getElementById('s_free').value = "0";
                showToast("已切換至質詢模式", false);
            }
            
            // 重置進度
            currentStageIndex = -1;
            totalSeconds = 0;
            currentSeconds = 0;
            isNormalRunning = false;
            currentStageName = "比賽尚未開始";
            
            document.getElementById('currentStageLabel').innerText = "比賽尚未開始";
            document.getElementById('currentStageLabel').className = "text-2xl md:text-4xl lg:text-5xl font-extrabold text-slate-800 dark:text-slate-100 tracking-wide text-center min-w-[180px] md:min-w-[300px] drop-shadow-md";
            
            resetTimerCore();
            updateNormalDisplay();
        }

        // --- 流程前進與推進 ---

        function nextStage() {
            autoLogBeforeSwitch();

            if (currentStageIndex === -1 && currentStageName === "比賽尚未開始") {
                currentStageIndex = 0;
            } else {
                currentStageIndex++;
            }

            if (currentStageIndex >= stageSequence.length) {
                showToast("這已經是最後一個環節了！", false);
                currentStageIndex = stageSequence.length - 1;
                return;
            }

            loadStageByIndex(currentStageIndex);
        }

        function prevStage() {
            if (currentStageIndex <= 0) {
                showToast("這已經是第一個環節了！", false);
                return;
            }
            autoLogBeforeSwitch();
            currentStageIndex--;
            loadStageByIndex(currentStageIndex);
        }

        function loadStageByIndex(index) {
            const next = stageSequence[index];
            if (next.type === 'normal') {
                setupNormalStage(next.name, next.minId, next.secId, next.colorClass, true);
            } else if (next.type === 'free') {
                setupFreeDebate(true);
            }
        }

        function autoLogBeforeSwitch() {
            if (currentStageName === "比賽尚未開始") return;
            if (!isFreeDebateMode && totalSeconds > 0 && currentSeconds < totalSeconds) {
                logCurrentTime(true);
            } else if (isFreeDebateMode && (freeAffCurrent < freeTotalSeconds || freeNegCurrent < freeTotalSeconds)) {
                logCurrentTime(true);
            }
        }

        // --- 常規計時器邏輯 ---

        function setupNormalStage(stageName, minId, secId, colorClass, fromSequence = false) {
            if (!fromSequence) {
                currentStageIndex = stageSequence.findIndex(s => s.name === stageName);
            }
            isFreeDebateMode = false;
            document.getElementById('normalTimerView').classList.remove('hidden');
            document.getElementById('freeDebateView').classList.add('hidden');

            const mVal = parseInt(document.getElementById(minId).value) || 0;
            const sVal = parseInt(document.getElementById(secId).value) || 0;
            
            totalSeconds = (mVal * 60) + sVal;
            currentSeconds = totalSeconds;
            currentStageName = stageName;
            
            const labelEl = document.getElementById('currentStageLabel');
            labelEl.innerText = stageName;
            labelEl.className = `text-2xl md:text-4xl lg:text-5xl font-extrabold tracking-wide text-center drop-shadow-md ${colorClass}`;
            
            resetTimerCore();
            updateNormalDisplay();

            if (window.innerWidth < 768 && isSidebarOpen) toggleSidebar();
        }

        function updateNormalDisplay() {
            const display = document.getElementById('timerDisplay');
            display.innerText = formatTime(currentSeconds);
            const cfg = getSoundConfig();

            display.classList.remove('glow-text', 'glow-text-yellow', 'glow-text-red', 'text-blue-700', 'text-amber-600', 'text-red-600', 'text-slate-800', 'dark:text-blue-400', 'dark:text-amber-400', 'dark:text-red-500', 'dark:text-white');
            
            if (currentSeconds < cfg.end) {
                display.classList.add('text-red-600', 'dark:text-red-500', 'glow-text-red');
            } else if (currentSeconds === cfg.end && totalSeconds > 0) {
                display.classList.add('text-red-600', 'dark:text-red-500', 'glow-text-red');
            } else if (currentSeconds <= cfg.warn && currentSeconds > cfg.end) {
                display.classList.add('text-amber-600', 'dark:text-amber-400', 'glow-text-yellow');
            } else {
                display.classList.add('text-blue-700', 'dark:text-blue-400', 'glow-text');
            }
        }

        function toggleNormalTimer() {
            if (totalSeconds === 0) {
                showToast("請先從左側設定環節時間！");
                if (!isSidebarOpen) toggleSidebar();
                return;
            }

            if (isNormalRunning) pauseNormalTimer();
            else startNormalTimer();
        }

        function startNormalTimer() {
            isNormalRunning = true;
            updateMainButton(true);
            playStartSound();
            
            if (!timerInterval) {
                timerInterval = setInterval(mainTimerTick, 1000);
            }
        }

        function pauseNormalTimer() {
            isNormalRunning = false;
            updateMainButton(false);
        }

        function resetTimer() {
            if (currentSeconds !== totalSeconds) {
                logCurrentTime(true);
            }
            resetTimerCore();
            updateNormalDisplay();
        }

        function resetTimerCore() {
            isNormalRunning = false;
            currentSeconds = totalSeconds;
            played60sBeep = false;
            played0sBeep = false;
            playedMinus15sBeep = false;
            updateMainButton(false);
        }

        function updateMainButton(playing) {
            const btn = document.getElementById('mainActionBtn');
            if (playing) {
                btn.className = "flex-1 min-w-[130px] max-w-[220px] bg-amber-600 hover:bg-amber-500 text-white text-base md:text-xl font-bold py-3 md:py-4 px-4 rounded-2xl shadow-lg transition-all transform active:scale-95 border border-amber-400 flex justify-center items-center gap-2";
                btn.innerHTML = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg><span id="mainBtnText">暫停計時</span>`;
            } else {
                btn.className = "flex-1 min-w-[130px] max-w-[220px] bg-emerald-600 hover:bg-emerald-700 text-white text-base md:text-xl font-bold py-3 md:py-4 px-4 rounded-2xl shadow-lg transition-all transform active:scale-95 border border-emerald-400 flex justify-center items-center gap-2";
                let btnTxt = (currentSeconds < totalSeconds) ? '繼續計時' : '開始計時';
                if(currentSeconds < 0) btnTxt = '繼續超時';
                btn.innerHTML = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg><span id="mainBtnText">${btnTxt}</span>`;
            }
        }

        // --- 自由辯論雙向時鐘邏輯 ---

        function setupFreeDebate(fromSequence = false) {
            if (!fromSequence) {
                currentStageIndex = stageSequence.findIndex(s => s.type === 'free');
            }
            isFreeDebateMode = true;
            document.getElementById('normalTimerView').classList.add('hidden');
            document.getElementById('freeDebateView').classList.remove('hidden');
            
            const mVal = parseInt(document.getElementById('m_free').value) || 0;
            const sVal = parseInt(document.getElementById('s_free').value) || 0;
            
            freeTotalSeconds = (mVal * 60) + sVal;
            freeAffCurrent = freeTotalSeconds;
            freeNegCurrent = freeTotalSeconds;
            activeFreeSide = null;
            freeAffHasStarted = false; 
            
            freeAff60sBeep = false; freeAff0sBeep = false; freeAffMinus15sBeep = false;
            freeNeg60sBeep = false; freeNeg0sBeep = false; freeNegMinus15sBeep = false;
            
            currentStageName = "自由辯論";

            document.getElementById('currentStageLabel').innerText = "自由辯論環節";
            document.getElementById('currentStageLabel').className = `text-2xl md:text-4xl lg:text-5xl font-extrabold tracking-wide text-center text-amber-600 dark:text-amber-400 drop-shadow-md`;
            
            updateFreeDisplay();
            if (window.innerWidth < 768 && isSidebarOpen) toggleSidebar();

            if (!timerInterval) {
                timerInterval = setInterval(mainTimerTick, 1000);
            }
        }

        function toggleFreeSide(side) {
            if (activeFreeSide === side) {
                activeFreeSide = null; 
            } else {
                activeFreeSide = side; 
                if (side === 'aff' && !freeAffHasStarted) {
                    playStartSound();
                    freeAffHasStarted = true; 
                }
            }
            updateFreeDisplay();
        }

        function pauseFreeDebate() {
            activeFreeSide = null;
            updateFreeDisplay();
        }

        function updateFreeDisplay() {
            const affDisplay = document.getElementById('freeAffTimer');
            const negDisplay = document.getElementById('freeNegTimer');
            affDisplay.innerText = formatTime(freeAffCurrent);
            negDisplay.innerText = formatTime(freeNegCurrent);
            const cfg = getSoundConfig();

            const affCard = document.getElementById('affCard');
            const negCard = document.getElementById('negCard');
            const affBtn = document.getElementById('affBtn');
            const negBtn = document.getElementById('negBtn');

            if (activeFreeSide === 'aff') {
                affCard.classList.add('active');
                affBtn.innerText = "正在發言...";
                affBtn.classList.replace('bg-blue-600', 'bg-blue-400');
            } else {
                affCard.classList.remove('active');
                affBtn.innerText = freeAffCurrent < freeTotalSeconds ? "繼續正方" : "點擊開始正方";
                affBtn.classList.replace('bg-blue-400', 'bg-blue-600');
            }
            
            if (activeFreeSide === 'neg') {
                negCard.classList.add('active');
                negBtn.innerText = "正在發言...";
                negBtn.classList.replace('bg-red-600', 'bg-red-400');
            } else {
                negCard.classList.remove('active');
                negBtn.innerText = freeNegCurrent < freeTotalSeconds ? "繼續反方" : "點擊開始反方";
                negBtn.classList.replace('bg-red-400', 'bg-red-600');
            }

            affDisplay.classList.remove('text-blue-700', 'dark:text-blue-400', 'text-amber-600', 'dark:text-amber-400', 'text-red-600', 'dark:text-red-500', 'glow-text', 'glow-text-yellow', 'glow-text-red');
            negDisplay.classList.remove('text-red-700', 'dark:text-red-400', 'text-amber-600', 'dark:text-amber-400', 'text-red-600', 'dark:text-red-500', 'glow-text-red', 'glow-text-yellow');

            if (freeAffCurrent < cfg.end || (freeAffCurrent === cfg.end && freeTotalSeconds > 0)) {
                affDisplay.classList.add('text-red-600', 'dark:text-red-500', 'glow-text-red');
            } else if (freeAffCurrent <= cfg.warn && freeAffCurrent > cfg.end) {
                affDisplay.classList.add('text-amber-600', 'dark:text-amber-400', 'glow-text-yellow');
            } else {
                affDisplay.classList.add('text-blue-700', 'dark:text-blue-400', 'glow-text');
            }

            if (freeNegCurrent < cfg.end || (freeNegCurrent === cfg.end && freeTotalSeconds > 0)) {
                negDisplay.classList.add('text-red-600', 'dark:text-red-500', 'glow-text-red');
            } else if (freeNegCurrent <= cfg.warn && freeNegCurrent > cfg.end) {
                negDisplay.classList.add('text-amber-600', 'dark:text-amber-400', 'glow-text-yellow');
            } else {
                negDisplay.classList.add('text-red-700', 'dark:text-red-400', 'glow-text-red');
            }
        }

        // --- 時鐘主循環 ---
        
        function mainTimerTick() {
            const cfg = getSoundConfig();
            
            if (!isFreeDebateMode) {
                if (isNormalRunning) {
                    currentSeconds--;
                    
                    if (currentSeconds === cfg.warn && !played60sBeep) { playBeep(1); played60sBeep = true; }
                    if (currentSeconds === cfg.end && !played0sBeep) { playBeep(2); played0sBeep = true; }
                    if (currentSeconds === cfg.over && !playedMinus15sBeep) { playBeep(3); playedMinus15sBeep = true; }
                    
                    updateNormalDisplay();
                }
            } else {
                if (activeFreeSide === 'aff') {
                    freeAffCurrent--;
                    
                    if (freeAffCurrent === cfg.warn && !freeAff60sBeep) { playBeep(1); freeAff60sBeep = true; }
                    if (freeAffCurrent === cfg.end && !freeAff0sBeep) { playBeep(2); freeAff0sBeep = true; }
                    if (freeAffCurrent === cfg.over && !freeAffMinus15sBeep) { playBeep(3); freeAffMinus15sBeep = true; }
                    
                    updateFreeDisplay();
                } else if (activeFreeSide === 'neg') {
                    freeNegCurrent--;
                    
                    if (freeNegCurrent === cfg.warn && !freeNeg60sBeep) { playBeep(1); freeNeg60sBeep = true; }
                    if (freeNegCurrent === cfg.end && !freeNeg0sBeep) { playBeep(2); freeNeg0sBeep = true; }
                    if (freeNegCurrent === cfg.over && !freeNegMinus15sBeep) { playBeep(3); freeNegMinus15sBeep = true; }
                    
                    updateFreeDisplay();
                }
            }
        }

        // --- 歷史記錄功能 ---

        function logCurrentTime(silent = false) {
            let record = null;

            if (!isFreeDebateMode) {
                if (totalSeconds === 0 || currentSeconds === totalSeconds) {
                    if(!silent) showToast("尚無計時數據可記錄！");
                    return;
                }
                const usedSecs = totalSeconds - currentSeconds;
                const status = currentSeconds < 0 ? `<span class="text-red-600 dark:text-red-400 font-bold px-2 py-1 bg-red-100 dark:bg-red-900/50 rounded font-mono">超時 ${formatTime(Math.abs(currentSeconds))}</span>` : '<span class="text-emerald-600 dark:text-emerald-400 font-bold">正常</span>';
                record = {
                    stage: currentStageName,
                    alloc: formatTime(totalSeconds),
                    used: formatTime(usedSecs),
                    status: status
                };
            } else {
                if (freeAffCurrent === freeTotalSeconds && freeNegCurrent === freeTotalSeconds) {
                    if(!silent) showToast("尚無計時數據可記錄！");
                    return;
                }
                const affUsed = freeTotalSeconds - freeAffCurrent;
                const affStatus = freeAffCurrent < 0 ? `<span class="text-red-600 dark:text-red-400 font-bold px-2 py-1 bg-red-100 dark:bg-red-900/50 rounded font-mono">超時 ${formatTime(Math.abs(freeAffCurrent))}</span>` : '<span class="text-emerald-600 dark:text-emerald-400 font-bold">正常</span>';
                timeRecords.push({ stage: "自由辯 (正方)", alloc: formatTime(freeTotalSeconds), used: formatTime(affUsed), status: affStatus });
                
                const negUsed = freeTotalSeconds - freeNegCurrent;
                const negStatus = freeNegCurrent < 0 ? `<span class="text-red-600 dark:text-red-400 font-bold px-2 py-1 bg-red-100 dark:bg-red-900/50 rounded font-mono">超時 ${formatTime(Math.abs(freeNegCurrent))}</span>` : '<span class="text-emerald-600 dark:text-emerald-400 font-bold">正常</span>';
                record = { stage: "自由辯 (反方)", alloc: formatTime(freeTotalSeconds), used: formatTime(negUsed), status: negStatus };
            }

            if (record) {
                timeRecords.push(record);
                renderRecords();
                if(!silent) showToast("用時已記錄！", false);
            }
        }

        function toggleRecordsModal() {
            const modal = document.getElementById('recordsModal');
            const box = document.getElementById('recordsModalBox');
            if (modal.classList.contains('hidden')) {
                renderRecords();
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                box.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function renderRecords() {
            const tbody = document.getElementById('recordsTableBody');
            if (timeRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-500 font-bold">尚無記錄</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            timeRecords.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 pr-2 font-bold text-slate-800 dark:text-slate-200">${r.stage}</td>
                    <td class="py-3 pr-2 text-slate-500 dark:text-slate-400 font-mono">${r.alloc}</td>
                    <td class="py-3 pr-2 text-slate-800 dark:text-white font-mono font-black">${r.used}</td>
                    <td class="py-3 text-right">${r.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearRecords() {
            if (confirm("確定要清空所有記錄嗎？")) {
                timeRecords = [];
                renderRecords();
                showToast("記錄已清空", false);
            }
        }

        // 初始化常規時鐘顯示
        updateNormalDisplay();
    </script>
</body>
</html>
